<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8483f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="110" fill="#f1f5f9"/>
  
  <!-- Tomato body -->
  <path d="M 128 40 Q 60 40 40 100 Q 40 160 128 160 Q 216 160 216 100 Q 216 40 128 40 Z" 
        fill="url(#tomatoGrad)" filter="url(#shadow)"/>
  
  <!-- Tomato highlight -->
  <path d="M 70 90 Q 90 70 110 90 Q 90 110 70 90 Z" 
        fill="rgba(255,255,255,0.25)"/>
  
  <!-- Stem -->
  <path d="M 128 30 Q 110 20 100 40 Q 105 45 128 45 Q 151 45 156 40 Q 146 20 128 30 Z" 
        fill="#2e7d32"/>
  
  <!-- Leaf -->
  <ellipse cx="150" cy="45" rx="30" ry="12" fill="#43a047" transform="rotate(-20 150 45)"/>
  
  <!-- Clock face -->
  <circle cx="128" cy="128" r="50" fill="#ffffff" stroke="#e8483f" stroke-width="4"/>
  
  <!-- Clock ticks -->
  <g stroke="#e8483f" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="82" x2="128" y2="72"/>
    <line x1="128" y1="184" x2="128" y2="174"/>
    <line x1="82" y1="128" x2="72" y2="128"/>
    <line x1="184" y1="128" x2="174" y2="128"/>
  </g>
  
  <!-- Clock hands -->
  <line x1="128" y1="128" x2="128" y2="80" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="128" x2="170" y2="128" stroke="#e8483f" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="128" cy="128" r="6" fill="#2c3e50"/>
  
  <!-- PomoTime text -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="#e8483f" text-anchor="middle">PomoTime</text>
</svg>
